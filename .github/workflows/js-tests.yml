# .github/workflows/js-tests.yml
name: JS Tests

on:
  workflow_call:

jobs:
  check:
    name: JS & TS checks
    # One 32-core job replaces a 14-leg matrix. The matrix existed to spread
    # ~612s of check payload over 4-core runners, and paid ~371s of duplicated
    # setup (14 checkouts, 14 node installs, 14 node_modules restores) to do
    # it. One larger runner installs once and lets each tool use the cores:
    # vitest, tsc and eslint all size their own worker pools from cpu_count.
    runs-on: ubuntu-latest-32-core
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26
          cache: npm

      - name: grab npm 12
        run: |
          # No-op once the bundled npm is already 12.x — saves ~5-15s/job and
          # keeps the installed major aligned with the npm12 cache-key tag.
          npm --version | grep -q '^12\.' || npm i -g npm@12

      # ``setup-node``'s ``cache: npm`` only caches the ~/.npm tarball cache;
      # the job would still re-extract the full workspace node_modules and
      # rerun postinstalls (including the Electron binary fetch). Cache the
      # installed tree itself, keyed on the lockfile, and skip ``npm ci`` on an
      # exact hit. No restore-keys: a partial hit would leave a stale tree, so
      # anything but an exact lockfile match reinstalls from scratch.
      #
      # This install runs WITH scripts, so the tree includes postinstall
      # artifacts (electron's postinstall unpacks its binary into
      # node_modules/electron/dist, which lives inside the cached tree — the
      # ~/.cache/electron download cache is deliberately NOT cached: with npm
      # ci skipped on hit it would never be read, only inflate the archive).
      - name: Restore node_modules
        id: node-modules-cache
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            node_modules
            apps/*/node_modules
            ui-tui/node_modules
            ui-tui/packages/*/node_modules
            tests-js/node_modules
            web/node_modules
          key: node-modules-scripts-${{ runner.os }}-node26-npm12-${{ hashFiles('package-lock.json') }}

      - uses: ./.github/actions/retry
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        with:
          command: npm ci

      # Every check runs concurrently, and the step fails only after all of
      # them finish. Two reasons this is not ``npm run --ws check``:
      #
      #   * ``--ws`` is serial and stops at the first failing workspace, so a
      #     run reports one failure where the matrix this replaced reported
      #     every failure at once.
      #   * The unit of work is a CHECK, not a workspace. apps/desktop is most
      #     of the payload and its own ``check`` is a serial && chain, so
      #     spreading only across workspaces leaves that chain as the long
      #     pole. Expanding a package's ``check:*`` sub-scripts (the same
      #     selection rule the old matrix job used) puts its lint, ui, electron
      #     and plugin suites in flight together.
      #
      # Discovery is ``npm query .workspace``, so a new package or a new
      # ``check:*`` script is picked up with no change here. An empty list is
      # an error, not an empty run: it would otherwise report green having
      # checked nothing.
      - name: Run all workspace checks
        run: node .github/scripts/run-workspace-checks.mjs
